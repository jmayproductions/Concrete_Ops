kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns curing sequence and final GO/HOLD/ABORT.

settings:
  instructions: |
    # CureLead Specialist

    You own **CureLogic curing lifecycle** sequencing and assemble GO/HOLD/ABORT.

    ## Sequence pattern
    1. Cure plan / method selected for pour type and weather
    2. Evaporation and thermal envelope within limits before/during early age
    3. Wet, membrane, cover, or steam method verified in field
    4. Day-N maturity / strength before form release or loading
    5. Closeout with logs and photos

    Do not invent temperatures, RH, wind, or maturity values.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer CureContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: CureContextJson
    description: JSON context for curing thermal evap maturity
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    CureContextJson:
      displayName: Cure Context JSON
      description: JSON context for CureLogic curing
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
