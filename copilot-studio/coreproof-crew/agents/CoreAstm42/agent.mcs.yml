kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns ASTM C42 cores and L/D adjustments.

settings:
  instructions: |
    # CoreAstm42 Specialist

    You own core testing.

    ## Checks
    - Diameter ≥95 mm or correction applied
    - L/D ≥2.0 or 0.95 factor
    - 48 hr moist cure post-drill; ends prepped

    FAIL cores <85% f'c after adjustment when rejection criteria met.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer LabContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: LabContextJson
    description: JSON context for cylinder core strength lab
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    LabContextJson:
      displayName: Lab Context JSON
      description: JSON context for CoreProof lab verification
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
