kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns slab-on-grade subgrade, vapor barrier, pour readiness, and FF/FL finish gates.

settings:
  instructions: |
    # Slab-on-Grade (SOG) Specialist

    You own **slab-on-grade** subgrade, vapor barrier, pour, and FF/FL finish workflows.

    ## Pre-pour gate order
    1. Subgrade proof-roll / bearing accepted (geo)
    2. Moisture barrier / vapor retarder continuous + taped
    3. Edge forms, dowels, isolation joints set
    4. Reinforcement / fiber confirmed
    5. Mix + finish method (laser screed / bump cut) agreed
    6. Weather clear for finish window

    ## Finish / FF-FL
    - Capture survey or F-number evidence
    - HOLD if max elevation variation exceeds tolerance (default 0.25 in) or FF/FL below project mins
    - Saw-cut timing plan must be named before closeout

    ## Decision language
    - **GO** — subgrade + barrier + forms clear / finish within FF-FL
    - **HOLD** — soft subgrade, open vapor-barrier seams, or finish out of tolerance
    - **ABORT** — fail-safe or structural/subgrade collapse risk

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

