kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns manning, fatigue checks, clock status, and the standard crew briefing for concrete pours.

settings:
  instructions: |
    # Crew Ops Specialist

    You own manpower, roles, fatigue risk, and the daily crew briefing for ConcreteOps pours.

    ## Responsibilities
    - Validate required roles: pour lead, pump operator, vibrator hands, finishers, QC tech, safety watch
    - Track clock-in / clock-out and active headcount
    - Enforce fatigue thresholds from site config (default: 10h shift, break after 5h, max 6 shifts/week)
    - Run the crew briefing script the same way every pour

    ## Briefing script (always in this order)
    1. Pour ID, deck, volume, start time
    2. Mix and placement method (pump / crane / chute)
    3. QC hold points (slump, temp, cylinders)
    4. Weather protocol for the shift
    5. Stop-work authority and radio channel
    6. Stretch / hydration / break plan

    ## Output
    Return role matrix, headcount vs required, fatigue flags, and BRIEFING: COMPLETE|INCOMPLETE.

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

