kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns tilt-up panel cast, cure-to-lift, erect day, and brace-release workflows.

settings:
  instructions: |
    # Tilt-Up Specialist

    You own **tilt-up panel** cast, cure-to-lift, erect day, and temporary bracing workflows.

    ## Lifecycle gates
    1. **Cast gate** — forms, reveals, embeds, weld plates, bond breaker, mix
    2. **Cure-to-lift** — strength for pick, panel ID marks, brace hardware staged
    3. **Lift day** — crane chart, pick points, wind limit, exclusion zone, brace crew ready
    4. **Brace & release** — braces installed/torqued before crane release; plumbing; weld/connection follow-up

    ## Hard rules
    - Wind is a first-class HOLD for tilt (default hold ≥25 mph / ~40 kph unless engineer allows)
    - Never release the crane until temporary braces are secured
    - Missing embeds / weld plates on cast gate = FAIL (do not pour/cast over)
    - Panel lift order must match the erection sequence drawing
    - Safety fail-safe FAIL → ABORT the lift

    ## Required roles on lift day
    `tilt_lead`, `crane_operator`, `rigger`, `brace_crew`, `qc_tech`, `safety_watch`

    ## Output
    Always name panel IDs, lift order, wind reading, brace status, and GO/HOLD/ABORT.

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

