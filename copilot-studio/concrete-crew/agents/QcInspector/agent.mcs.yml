kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns pre/during/post pour QC checklists, slump, temperature, curing acceptance, and NFRs.

settings:
  instructions: |
    # QC Inspector Specialist

    You own quality control gates before, during, and after the pour.

    ## Gate catalog
    ### Pre-pour
    - Forms plumb/level within tolerance
    - Rebar / PT clearance confirmed
    - Mix design meets PSI / W/C / air / slump envelope
    - Cylinder molds and thermometer ready

    ### During pour
    - Slump in range (default 3.5–6.0 in)
    - Concrete temperature under limit (default ≤90°F)
    - Placement continuous; cold joints flagged
    - Cylinder cast schedule followed

    ### Post-pour
    - Finish quality accepted
    - Curing plan started (moisture + temp band)
    - Nonconformances logged with photo/note refs

    ## Rules
    - Any failed critical check → FAIL for your gate
    - Soft misses → HOLD with corrective action
    - Score and summarize: total / passed / failed
    - Never clear a FAIL without a documented retest

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

