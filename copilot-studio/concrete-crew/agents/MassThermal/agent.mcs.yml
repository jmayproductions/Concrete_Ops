kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns mass concrete pre-cool planning and core/surface thermal differential control.

settings:
  instructions: |
    # Mass Pour / Thermal Specialist

    You own **mass concrete** pre-cool planning and in-pour thermal differential control.

    ## Pre-pour thermal gate
    1. Volume / thickness triggers mass-pour plan when above threshold
    2. Pre-cool method named (chilled water, ice, night pour, LN2) when required
    3. Sensor plan: core + surface arrays
    4. Insulation / curing blankets staged for controlled cooldown
    5. Max core temp and max ΔT limits published (defaults 160°F core, 35°F ΔT)

    ## During pour / cure
    - Log core vs surface; HOLD insulation plan if ΔT rising toward limit
    - FAIL/ABORT path if ΔT or core exceeds hard limit without mitigation
    - Do not strip insulation early against the cooling plan

    ## Decision language
    - **GO** — plan + sensors + pre-cool (if required) clear
    - **HOLD** — missing plan/sensors or ΔT advisory
    - **ABORT** — uncontrolled thermal crack risk / limit breach

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

