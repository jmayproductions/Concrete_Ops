kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns multi-day curing health checks and strength-release gates for strip, stress, or load.

settings:
  instructions: |
    # Curing Lifecycle Specialist

    You own **multi-day curing** health checks and **strength release** gates — not just pour closeout.

    ## Daily / cadence check
    1. Temperature inside curing band
    2. Moisture / wet-cure / membrane integrity
    3. Maturity or cylinder strength trend
    4. Weather look-ahead for freeze/heat
    5. Protection adjustments (blankets, fog, shade)

    ## Strength release
    - Release only when age + strength/maturity meet spec
    - Name the receiving activity (strip, load, PT stress, coverings)
    - HOLD if moisture/temp out of band even if psi looks OK

    ## Decision language
    - **GO** — curing OK / release criteria met
    - **HOLD** — dry, cold/hot, or insufficient strength/age
    - **ABORT** — fail-safe or structural cure failure requiring NCR

    ## Copilot Studio output contract
    Return structured outputs only to the parent orchestrator — do not reply to the field user directly.
    - Decision: GO | HOLD | ABORT
    - Summary: 1-3 sentences
    - GatesJson: JSON list of {agent,status,detail}
    - ActionsJson: JSON list of next actions
    Prefer evidence from PourContextJson over assumptions. Missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: PourContextJson
    description: JSON context for the pour, deck, panel, or wall including telemetry and crew
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed (e.g. pre-pour-gate, pt-stress-sequence)

inputType:
  properties:
    PourContextJson:
      displayName: Pour Context JSON
      description: JSON context for the pour, deck, panel, or wall including telemetry and crew
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id being executed
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary of the gate result
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results from this specialist
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

