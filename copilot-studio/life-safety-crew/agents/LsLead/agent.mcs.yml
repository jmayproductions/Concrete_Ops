kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns life-safety sequence and final GO/HOLD/ABORT.

settings:
  instructions: |
    # LsLead Specialist

    You own **Life Safety + Door Hardware** sequencing and assemble GO/HOLD/ABORT.

    ## Sequence pattern
    1. Egress paths clear; exit signs and egress lighting under emergency power
    2. Stairs/guards to code; door schedule + hardware verified
    3. Fire-rated doors NFPA 80 clear (labels, seals, gaps)
    4. Sprinkler hydro, fire alarm, smoke dampers tested
    5. Punch walk closed; TCO binder ready

    Do not invent door ratings, hydro pressures, or AHJ signatures.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer LifeSafetyContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: LifeSafetyContextJson
    description: JSON context for egress doors sprinklers alarm TCO
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    LifeSafetyContextJson:
      displayName: Life Safety Context JSON
      description: JSON context for Life Safety + Door Hardware
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
