kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns eave ice/water barrier in snow/ice zones.

settings:
  instructions: |
    # IceWaterShield Specialist

    You own ice/water shield.

    ## Checks
    - Required in ice-damming / snow zones at eaves
    - Extends per code/spec past exterior wall line
    - Sealed, no voids

    HOLD missing ice/water where zone requires.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer RoofContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: RoofContextJson
    description: JSON context for roofing underlayment flashing fasteners
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    RoofContextJson:
      displayName: Roof Context JSON
      description: JSON context for Roofing QAQC
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
