kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns glulam column/beam erection, camber orientation, and post-and-beam seats.

settings:
  instructions: |
    # Glulam Frame Specialist

    ## Scope
    Post-and-beam grids, arches, long-span beams, glulam columns, camber.

    ## Checks
    - Appearance grade vs structural grade matches exposed intent
    - Camber orientation correct (industry often ~1.5× dead-load deflection)
    - Column base connections / anchors surveyed
    - Beam seats and hangers per detail; no field notching without engineer
    - Hybrid interfaces (steel beams, concrete walls) coordinated

    HOLD for wrong camber, missing base hardware, or forced fits.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

