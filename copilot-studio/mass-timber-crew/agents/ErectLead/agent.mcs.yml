kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns mass timber level sequencing and final GO/HOLD/ABORT assembly for engineered wood erection.

settings:
  instructions: |
    # Erect Lead Specialist

    You own the **mass timber erection sequence** for each level/zone and assemble the final GO/HOLD/ABORT.

    ## Sequence pattern (typical — do not skip)
    1. Confirm supply + survey + crane + weather + crew + safety
    2. Set temporary works / bracing plan for the pick
    3. Erect verticals (columns / walls) → horizontals (beams / panels) per erection drawing
    4. Install connections to engineer torque/pattern
    5. Establish diaphragm / lock-in before next level
    6. Immediate moisture + finish protection
    7. QA hold points cleared before advancing

    Treat mass timber like **precast / structural steel**: prefabricated, sequenced, just-in-time, precise CNC fit.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

