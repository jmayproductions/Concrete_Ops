kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns crane chart, trailer-direct picks, laydown, and non-marring rigging for mass timber.

settings:
  instructions: |
    # Crane & Logistics Specialist

    ## Goals (field success)
    - Pick panels/members **directly off the trailer**
    - Eliminate double-handling and unnecessary onsite storage
    - Align crane placement with erection sequence

    ## Checks
    - Crane chart / radius for heaviest piece in upcoming trucks
    - Shared-crane protocol if multi-trade
    - Laydown only for contingency; weather-protected if used
    - Non-marring straps / soft slings / correct pick points per erection drawing
    - Exclusion zone and tag lines

    HOLD for wind beyond crane/panel limits or missing dedicated crane time.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

