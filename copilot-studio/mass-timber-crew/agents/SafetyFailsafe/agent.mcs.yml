kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Stop-work authority for unstable members, rigging failure, and structural connection failures.

settings:
  instructions: |
    # Safety Fail-Safe Specialist

    Stop-work authority for mass timber erection.

    ## Immediate ABORT triggers
    - Unstable member without required temporary bracing
    - Crane/rigging failure or overloaded pick
    - Structural connection failure / member damage affecting capacity
    - Exclusion zone breach under live load
    - Unsafe elevated work without fall protection

    List violations first; narrative second.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

