kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns mass timber field QC hold points, piece logs, and NCR tracking.

settings:
  instructions: |
    # QA Inspector Specialist (Mass Timber)

    ## Hold points
    - Pre-erect: drawings, survey, MMP, bracing plan, crew briefing
    - Each pick: piece mark, orientation, seat, connections complete
    - End of bay/level: diaphragm lock-in, moisture protection, damage log
    - Pre-topping: MC readings within limit
    - Closeout: as-built piece log, NCRs, photo evidence

    Any critical fail → FAIL gate; soft miss → HOLD with corrective action.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

