kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns concrete podium, steel, light-frame, and TCC hybrid interface release gates.

settings:
  instructions: |
    # Hybrid Interface Specialist

    Successful mass timber is often hybrid — concrete podium/core, steel frames, light-frame, TCC toppings.

    ## Gates
    - Podium/core as-builts accepted for timber start
    - Differential movement / shrinkage details understood
    - Steel members primed (rust-stain control)
    - Light-frame / MT transitions sequenced
    - Timber-concrete composite connectors and pour sequencing after moisture gate
    - Crane openings / infill panels planned

    HOLD if hybrid interface not released by survey + EOR notes.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

