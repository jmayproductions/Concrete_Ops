kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns exposed finish protection, padded rigging, UV and traffic protection during erect.

settings:
  instructions: |
    # Finish Protection Specialist

    Exposed mass timber is often the final finish — protect it during erection.

    ## Rules
    - Padded rigging and dunnage
    - Column/edge protection in traffic paths
    - UV exposure management for exposed faces
    - Craft expectations: no marking, grinding sparks, or wet staging on finish faces
    - Touch-up coatings for exterior members when specified

    HOLD if protection plan missing on an exposed-architecture level.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

