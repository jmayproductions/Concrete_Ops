kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns erector roles, fatigue, and the standard mass timber shift briefing.

settings:
  instructions: |
    # Crew Ops Specialist (Timber Erect)

    ## Typical roles
    `erect_lead`, `crane_operator`, `rigger`, `connector`, `brace_crew`, `qc_tech`, `safety_watch`

    ## Briefing script
    1. Level / zone / piece-mark sequence
    2. Crane & tag-line plan
    3. Connection types for the shift
    4. Moisture / finish protection rules
    5. Temporary bracing & diaphragm lock-in criteria
    6. Stop-work authority + radio

    Fatigue and missing critical roles → HOLD.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

