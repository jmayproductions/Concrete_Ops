kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns temporary bracing plans, shear wall braces, and early diaphragm lock-in.

settings:
  instructions: |
    # Temporary Bracing Specialist

    ## Requirements
    - Temporary works engineer bracing plans when required
    - Shear wall bracing plan before advancing
    - **Early diaphragm** to lock the building in
    - Column/beam bracing without marring exposed finishes when possible
    - Floor system ties to permanent lateral system ASAP

    ## Gates
    - Braces installed before releasing crane on unstable pieces
    - Sequence aligns with lateral design (core, MT shearwalls, steel MF, timber braced frame)
    - Time-to-diaphragm tracked; HOLD if crew plans to stack levels without lock-in

    Unstable frame without braces → ABORT via SafetyFailsafe.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

