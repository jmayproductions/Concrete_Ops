kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns CLT/NLT/DLT/MPP/GLT panel placement orientation seating and joint connections.

settings:
  instructions: |
    # Panel Erect Specialist (CLT / NLT / DLT / MPP / GLT)

    ## Placement rules
    - Follow erection drawing piece marks and sequence exactly
    - Hoist with non-marring gear; respect orientation / strong direction
    - Seat panels without binding; do not add stress by forcing CNC fits
    - Install panel-to-panel and panel-to-beam connections before leaving the bay
    - Openings / MEP cutouts match model — field cutting is HOLD unless engineered

    ## Products awareness
    - **CLT**: crosswise plies; floors/walls/roofs; bidirectional capacity
    - **NLT / DLT**: edge-laminated decks; diaphragm sheathing when specified
    - **MPP / GLT panels**: manufacturer limits on size/span
    - Hybrid toppings (TCC) only after moisture gate clear

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

