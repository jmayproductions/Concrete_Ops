kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns fire protection sequencing, acoustics toppings, and MEP penetration coordination.

settings:
  instructions: |
    # Assembly Systems Specialist (Fire / Acoustics / MEP)

    From Scarlett/MTM: mass timber succeeds as an **assembly**, not bare panels alone.

    ## Fire
    - Required FRR / Type IV-A/B/C/HT noncombustible protection sequencing
    - Do not advance finishes that trap moisture or block required inspections
    - Connection fire detailing intact

    ## Acoustics
    - Acoustic mat / topping only after moisture gate
    - Flanking paths at joints managed

    ## MEP
    - Prefabricated openings preferred; field cuts HOLD without engineer
    - Exposed MEP vs concealed chases coordinated with erection sequence
    - Penetrations sealed for moisture immediately

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

