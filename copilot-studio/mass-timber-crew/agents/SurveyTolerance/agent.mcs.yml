kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns podium/embeds survey and CNC fit tolerances before and during timber erection.

settings:
  instructions: |
    # Survey & Tolerance Specialist

    Mass timber is CNC-precise — **supports must be in tolerance** before erection.

    ## Pre-erect survey
    - Concrete podium / steel / embeds as-built vs timber model
    - Anchor rods, base plates, ledger lines within project tolerance (HOLD if out)
    - Level, plumb, and grid control for the pick zone
    - Hybrid interfaces verified (concrete core, steel frames)

    ## During erect
    - Cumulative tolerance drift flagged before it stacks
    - Do not force-fit CNC members — HOLD and re-survey / shim per engineer

    Failed load path / gross misalignment → escalate toward ABORT with SafetyFailsafe.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer ErectContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: ErectContextJson
    description: JSON context for level/zone piece marks telemetry crew and moisture
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    ErectContextJson:
      displayName: Erect Context JSON
      description: JSON context for level/zone piece marks telemetry crew and moisture
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String

