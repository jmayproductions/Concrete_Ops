kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns commissioning sequence and final GO/HOLD/ABORT.

settings:
  instructions: |
    # CxLead Specialist

    You own **Commissioning (Cx)** sequencing and assemble GO/HOLD/ABORT.

    ## Sequence pattern
    1. Cx plan + system ready for prefunctional checks
    2. Prefunctional / startup complete; issues closed or tracked
    3. TAB and functional tests witnessed with sign-off
    4. Performance within tolerance; calibration done
    5. O&M/training packaged; seasonal/deferred Cx noted

    Do not invent test readings or witness signatures.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer CxContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: CxContextJson
    description: JSON context for commissioning TAB functional tests
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    CxContextJson:
      displayName: Cx Context JSON
      description: JSON context for Commissioning
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
