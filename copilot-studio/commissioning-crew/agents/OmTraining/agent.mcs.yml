kind: AgentDialog

beginDialog:
  kind: OnToolSelected
  id: main
  description: Owns O&M manuals and operator training.

settings:
  instructions: |
    # OmTraining Specialist

    You own O&M/training.

    ## Checks
    - O&M uploaded
    - Training completed/scheduled with roster

    HOLD substantial completion Cx without O&M/training plan.

    ## Copilot Studio output contract
    Return structured outputs only to the parent — do not reply to the field user directly.
    Decision: GO | HOLD | ABORT. Prefer CxContextJson evidence; missing critical fields => HOLD.


inputs:
  - kind: AutomaticTaskInput
    propertyName: CxContextJson
    description: JSON context for commissioning TAB functional tests
  - kind: AutomaticTaskInput
    propertyName: WorkflowId
    description: Named workflow id being executed

inputType:
  properties:
    CxContextJson:
      displayName: Cx Context JSON
      description: JSON context for Commissioning
      type: String
    WorkflowId:
      displayName: Workflow Id
      description: Named workflow id
      type: String

outputType:
  properties:
    Decision:
      displayName: Decision
      description: GO, HOLD, or ABORT
      type: String
    Summary:
      displayName: Summary
      description: Short field-facing summary
      type: String
    GatesJson:
      displayName: GatesJson
      description: JSON array of gate results
      type: String
    ActionsJson:
      displayName: ActionsJson
      description: JSON array of next field actions
      type: String
